[build]
  base = "frontend"
  publish = "."
  command = "echo Publishing static frontend"

[[redirects]]
  from = "/api/*"
  to = "https://alaska-lock-vcr-formula.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://alaska-lock-vcr-formula.trycloudflare.com/media/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
