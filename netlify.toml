[build]
  base = "frontend"
  publish = "."
  command = "echo Publishing static frontend"

[[redirects]]
  from = "/api/*"
  to = "https://kinds-andale-beans-appropriate.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://kinds-andale-beans-appropriate.trycloudflare.com/media/:splat"
  status = 200
  force = true
